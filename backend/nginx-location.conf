# Insert inside the existing HTTPS server{} after taking a backup.
# Runtime DNS keeps other sites independent of this API's startup/recreation.
location = /chronograph {
    return 308 /chronograph/;
}

location ^~ /chronograph/ {
    # Subscription/pairing URLs contain bearer tokens. Do not persist request paths.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $chronograph_upstream chronograph-api:8000;
    rewrite ^/chronograph/(.*)$ /$1 break;
    proxy_pass http://$chronograph_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /chronograph;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

