[project]
name = "chronograph-backend"
version = "0.1.0"
description = "ChronoGraph private calendar coordination API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34.2,<1", "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2.6,<4", "alembic>=1.15.2,<2", "PyJWT[crypto]>=2.10.1,<3",
  "httpx>=0.28.1,<1", "pydantic>=2.11.3,<3", "tzdata>=2025.2",
  "argon2-cffi>=25.1.0,<26",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
